/* ============ 3. Penyajian Data ============ */
const DS = {
  ekskul: { t: 'Ekskul favorit siswa', cat: ['Basket', 'Pramuka', 'Seni', 'Sains'], v: [12, 8, 6, 14] },
  suhu: { t: 'Suhu kota (°C) tiap waktu', cat: ['06.00', '09.00', '12.00', '15.00', '18.00'], v: [22, 26, 31, 29, 24] },
  nilai: { t: 'Nilai ulangan (banyak siswa)', cat: ['50-59', '60-69', '70-79', '80-89', '90-100'], v: [3, 7, 12, 9, 4] }
};
const COL = ['#dc2626', '#1e3a8a', '#eab308', '#16a34a', '#7c3aed'];
reg('st-penyajian', {
  html: R`
<h2>Jenis Penyajian Data</h2>
<h3>🎯 Konsep &amp; Definisi</h3>
<p>Data disajikan agar mudah dibaca dan dibandingkan. Pilihan penyajian bergantung pada tujuan.</p>
<ul>
<li><b>Tabel (daftar/frekuensi)</b>: baris dan kolom berisi data dan frekuensinya.</li>
<li><b>Diagram batang</b>: membandingkan nilai antar kategori; <b>histogram</b> untuk data kelompok (batang berimpit).</li>
<li><b>Diagram garis</b>: menunjukkan <i>perubahan</i> data dari waktu ke waktu.</li>
<li><b>Diagram lingkaran</b>: menunjukkan <i>bagian terhadap keseluruhan</i> (persentase).</li></ul>
${formula(R`Persentase kategori: $\dfrac{f_i}{\sum f}\times100\%$ &nbsp;&nbsp; Sudut pusat juring: $\dfrac{f_i}{\sum f}\times360^\circ=\text{persentase}\times3{,}6^\circ$`)}
${tips(R`Jumlah semua sudut juring $=360^\circ$ dan jumlah semua persentase $=100\%$. Gunakan itu untuk memeriksa hitunganmu.`)}
<h3>🎮 Simulasi: Satu Data, Banyak Penyajian</h3>
${sim(R`<div class="flex flex-wrap gap-2"><select id="pj-d" class="border-2 border-slate-300 rounded-lg px-3 py-2">${Object.keys(DS).map(k => `<option value="${k}">${DS[k].t}</option>`).join('')}</select>
<select id="pj-t" class="border-2 border-slate-300 rounded-lg px-3 py-2"><option value="tabel">Tabel</option><option value="batang">Diagram batang</option><option value="garis">Diagram garis</option><option value="lingkaran">Diagram lingkaran</option></select></div>
<div id="pj-v" class="mt-3 overflow-x-auto"></div><p id="pj-n" class="text-sm text-slate-600"></p>`)}
<h3>📝 Contoh Soal</h3>
${contoh(1, {
  soal: R`Dalam diagram lingkaran, kegiatan favorit $200$ siswa: Basket $25\%$, Renang $40\%$, Voli $35\%$. Tentukan sudut juring Renang dan banyak siswa yang memilih Voli.`,
  dik: R`Total $=200$ siswa; Renang $=40\%$; Voli $=35\%$.`, dit: R`Sudut juring Renang dan banyak penyuka Voli.`, rumus: R`Sudut $=\text{persen}\times3{,}6^\circ$; banyak $=\text{persen}\times\text{total}$.`,
  langkah: [
    [R`Sudut Renang $=40\%\times360^\circ=144^\circ$.`, R`Seluruh lingkaran $=360^\circ$ mewakili $100\%$.`],
    [R`Banyak penyuka Voli $=35\%\times200=70$ siswa.`, R`Persentase dikalikan banyak seluruh siswa.`],
    [R`Pemeriksaan: $25\%+40\%+35\%=100\%$.`, R`Jumlah persentase harus tepat $100\%$.`]
  ]
})}
${miniNum('pj1', R`Pada diagram lingkaran, sebuah juring berpersentase $15\%$. Berapa derajat sudut pusat juring tersebut?`, 54,
  R`<p>Sudut $=15\%\times360^\circ=\dfrac{15}{100}\times360^\circ=54^\circ$.</p>`)}
`,
  init() {
    const sd = qs('#pj-d'), st = qs('#pj-t'), v = qs('#pj-v'), nt = qs('#pj-n');
    const draw = () => {
      const D = DS[sd.value], tot = sum(D.v), mx = Math.max(...D.v); let s = '';
      if (st.value === 'tabel') s = tbl(D.cat.map((c, i) => [c, D.v[i], d2(D.v[i] / tot * 100) + '%', d2(D.v[i] / tot * 360) + '°']), ['Kategori', 'Frekuensi', 'Persentase', 'Sudut']);
      else if (st.value === 'batang') { s = '<svg viewBox="0 0 400 230" class="w-full" style="max-width:480px"><line x1="30" y1="190" x2="390" y2="190" stroke="#334155"/><line x1="30" y1="10" x2="30" y2="190" stroke="#334155"/>';
        D.cat.forEach((c, i) => { const w = 300 / D.cat.length, x = 45 + i * w, h = D.v[i] / mx * 160; s += `<rect x="${x}" y="${190 - h}" width="${w * .65}" height="${h}" fill="${COL[i % 5]}"/><text x="${x + w * .325}" y="${184 - h}" text-anchor="middle" font-size="12">${D.v[i]}</text><text x="${x + w * .325}" y="206" text-anchor="middle" font-size="11">${c}</text>`; }); s += '</svg>'; }
      else if (st.value === 'garis') { const pts = D.v.map((y, i) => [50 + i * 330 / (D.v.length - 1), 190 - y / mx * 160]);
        s = `<svg viewBox="0 0 400 230" class="w-full" style="max-width:480px"><line x1="30" y1="190" x2="390" y2="190" stroke="#334155"/><line x1="30" y1="10" x2="30" y2="190" stroke="#334155"/><polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="#dc2626" stroke-width="3"/>` +
          pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#1e3a8a"/><text x="${p[0]}" y="${p[1] - 9}" text-anchor="middle" font-size="12">${D.v[i]}</text><text x="${p[0]}" y="206" text-anchor="middle" font-size="11">${D.cat[i]}</text>`).join('') + '</svg>'; }
      else { let a0 = -Math.PI / 2; s = '<svg viewBox="0 0 400 230" class="w-full" style="max-width:480px">';
        D.v.forEach((f, i) => { const a1 = a0 + f / tot * 2 * Math.PI, x0 = 115 + 95 * Math.cos(a0), y0 = 115 + 95 * Math.sin(a0), x1 = 115 + 95 * Math.cos(a1), y1 = 115 + 95 * Math.sin(a1);
          s += `<path d="M115,115 L${x0},${y0} A95,95 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1},${y1} Z" fill="${COL[i % 5]}" stroke="#fff" stroke-width="2"/><rect x="240" y="${40 + i * 28}" width="14" height="14" fill="${COL[i % 5]}"/><text x="262" y="${52 + i * 28}" font-size="12">${D.cat[i]}: ${d2(f / tot * 100)}% (${d2(f / tot * 360)}°)</text>`; a0 = a1; }); s += '</svg>'; }
      v.innerHTML = s;
      nt.textContent = { tabel: 'Tabel memuat data lengkap beserta persentase dan sudut juring.', batang: 'Diagram batang cocok untuk membandingkan antar kategori.', garis: 'Diagram garis cocok untuk melihat perubahan dari waktu ke waktu (paling cocok untuk data suhu).', lingkaran: 'Diagram lingkaran cocok untuk melihat bagian terhadap keseluruhan.' }[st.value];
    };
    sd.onchange = st.onchange = draw; draw();
  }
});

/* ============ 4. Ukuran Pusat Data Tunggal ============ */
reg('st-pusat', {
  html: R`
<h2>Data Tunggal: Ukuran Pusat</h2>
<h3>🎯 Konsep &amp; Definisi</h3>
<p>Ukuran pusat adalah satu nilai yang mewakili kecenderungan pusat sekumpulan data.</p>
<ul><li><b>Mean (rata-rata)</b>: jumlah seluruh data dibagi banyak data.</li><li><b>Median</b>: nilai tengah setelah data <b>diurutkan</b>.</li><li><b>Modus</b>: nilai yang paling sering muncul (bisa lebih dari satu, atau tidak ada).</li></ul>
${formula(R`$$\bar{x}=\frac{x_1+x_2+\dots+x_n}{n}=\frac{\sum x_i}{n}$$ Median: $n$ ganjil $\Rightarrow Me=x_{\frac{n+1}{2}}$; &nbsp; $n$ genap $\Rightarrow Me=\dfrac{x_{n/2}+x_{n/2+1}}{2}$. &nbsp; Modus: data dengan frekuensi terbesar.`)}
${tips(R`Rata-rata mudah <b>terpengaruh data ekstrem</b>, sedangkan median dan modus tidak. Coba tombol "Tambah data ekstrem" pada simulasi.`)}
<h3>🎮 Simulasi: Mean, Median, dan Modus</h3>
${sim(R`<label>Data (pisahkan dengan koma atau spasi): <input id="ps-in" value="6, 7, 7, 8, 9, 10, 12" class="border-2 border-slate-300 rounded-lg px-3 py-1 w-full"></label>
<div id="ps-svg" class="mt-2 overflow-x-auto"></div><div id="ps-out" class="mt-2 overflow-x-auto"></div>
${btns('<button id="ps-ex" class="btn-red">➕ Tambah data ekstrem</button>', '<button id="ps-rs" class="btn-navy">Reset</button>')}`)}
<h3>📝 Contoh Soal</h3>
${contoh(1, {
  soal: R`Nilai ulangan $8$ siswa: $7, 8, 6, 9, 8, 10, 5, 8$. Tentukan mean, median, dan modusnya.`,
  dik: R`Data: $7,8,6,9,8,10,5,8$; $n=8$.`, dit: R`$\bar{x}$, $Me$, dan $Mo$.`, rumus: R`$\bar{x}=\dfrac{\sum x}{n}$; median data genap; modus = terbanyak.`,
  langkah: [
    [R`Mean: $\sum x=7+8+6+9+8+10+5+8=61$, maka $\bar{x}=\dfrac{61}{8}=7{,}625$.`, R`Jumlahkan semua data lalu bagi banyak data.`],
    [R`Urutkan: $5,6,7,8,8,8,9,10$.`, R`Median harus dicari dari data yang sudah terurut.`],
    [R`$n=8$ (genap): $Me=\dfrac{x_4+x_5}{2}=\dfrac{8+8}{2}=8$.`, R`Median data genap adalah rata-rata dua data tengah.`],
    [R`Modus: angka $8$ muncul $3$ kali (paling sering), jadi $Mo=8$.`, R`Modus adalah data dengan frekuensi terbesar.`]
  ]
})}
${miniNum('ps1', R`Median dari data $3, 9, 4, 7, 5, 8, 6$ adalah ...`, 6,
  R`<p>Urutkan: $3,4,5,6,7,8,9$. $n=7$ (ganjil), median = data ke-$\dfrac{7+1}{2}=4$, yaitu $6$.</p>`)}
`,
  init() {
    const inp = qs('#ps-in'), svg = qs('#ps-svg'), out = qs('#ps-out'), def = inp.value;
    const draw = () => {
      const a = parse(inp.value); if (!a.length) { svg.innerHTML = ''; out.textContent = 'Masukkan minimal satu angka.'; return; }
      const s = srt(a), mn = s[0], mx = s[s.length - 1], sc = v => 30 + (mx === mn ? .5 : (v - mn) / (mx - mn)) * 460, m = mean(a), md = med(a), mo = modus(a), cnt = {};
      let g = '<svg viewBox="0 0 520 150" class="w-full" style="min-width:420px"><line x1="20" y1="100" x2="500" y2="100" stroke="#334155" stroke-width="2"/>';
      s.forEach(v => { cnt[v] = (cnt[v] || 0) + 1; g += `<circle cx="${sc(v)}" cy="${94 - cnt[v] * 12}" r="5.5" fill="${mo.length < s.length && mo.includes(v) ? '#eab308' : '#1e3a8a'}" stroke="#0f172a"/>`; });
      g += `<text x="30" y="118" font-size="11" text-anchor="middle">${mn}</text><text x="490" y="118" font-size="11" text-anchor="middle">${mx}</text>`;
      g += `<line x1="${sc(md)}" y1="30" x2="${sc(md)}" y2="100" stroke="#1e3a8a" stroke-width="2" stroke-dasharray="4"/><text x="${sc(md)}" y="24" font-size="11" text-anchor="middle" fill="#1e3a8a">Me</text>`;
      g += `<polygon points="${sc(m) - 7},118 ${sc(m) + 7},118 ${sc(m)},104" fill="#dc2626"/><text x="${sc(m)}" y="136" font-size="11" text-anchor="middle" fill="#dc2626">mean</text></svg>`;
      svg.innerHTML = g;
      const modTxt = mo.length === s.length ? 'tidak ada modus (semua data muncul sama banyak)' : mo.join(' dan ');
      out.innerHTML = `<p>$n=${a.length}$, &nbsp; $\\sum x=${sum(a)}$</p><p>$\\bar{x}=\\dfrac{${sum(a)}}{${a.length}}=${d2(m)}$ &nbsp; (segitiga merah)</p><p>Data terurut: ${s.join(', ')}</p><p>$Me=${d2(md)}$ &nbsp; (garis putus-putus biru)</p><p>Modus: <b>${modTxt}</b> &nbsp; (titik kuning)</p>`; tex(out);
    };
    inp.oninput = draw;
    qs('#ps-ex').onclick = () => { const a = parse(inp.value); inp.value = a.concat([Math.max(...a, 10) * 3]).join(', '); draw(); };
    qs('#ps-rs').onclick = () => { inp.value = def; draw(); }; draw();
  },
  soal: null
});

/* ============ 5. Jangkauan & Kuartil ============ */
reg('st-kuartil', {
  html: R`
<h2>Data Tunggal: Jangkauan &amp; Kuartil</h2>
<h3>🎯 Konsep &amp; Definisi</h3>
<p><b>Jangkauan</b> (rentang) adalah selisih data terbesar dan terkecil. <b>Kuartil</b> membagi data terurut menjadi empat bagian sama banyak: $Q_1$ (kuartil bawah), $Q_2$ (median), $Q_3$ (kuartil atas).</p>
${formula(R`$$J=x_{max}-x_{min}\qquad H=Q_3-Q_1\ (\text{jangkauan interkuartil})\qquad Q_d=\frac{1}{2}(Q_3-Q_1)\ (\text{simpangan kuartil})$$ Cara mencari kuartil: urutkan data; $Q_2$ = median; $Q_1$ = median kelompok bawah; $Q_3$ = median kelompok atas. (Jika $n$ ganjil, median tidak ikut dimasukkan ke kelompok bawah maupun atas.)`)}
${tips(R`Kuartil tidak terpengaruh data ekstrem. $50\%$ data di tengah (antara $Q_1$ dan $Q_3$) memiliki rentang $H$.`)}
<h3>🎮 Simulasi: Kuartil dan Diagram Kotak Garis</h3>
${sim(R`<label>Data: <input id="kq-in" value="12, 15, 17, 18, 20, 22, 25, 28, 30, 35" class="border-2 border-slate-300 rounded-lg px-3 py-1 w-full"></label>
<div id="kq-svg" class="mt-2 overflow-x-auto"></div><div id="kq-out" class="mt-2 overflow-x-auto"></div>`)}
<h3>📝 Contoh Soal</h3>
${contoh(1, {
  soal: R`Data tinggi badan (cm) $8$ siswa: $150, 162, 158, 155, 170, 165, 160, 168$. Tentukan jangkauan, $Q_1$, $Q_2$, $Q_3$, jangkauan interkuartil, dan simpangan kuartil.`,
  dik: R`Data tidak terurut, $n=8$.`, dit: R`$J$, $Q_1$, $Q_2$, $Q_3$, $H$, $Q_d$.`, rumus: R`$J=x_{max}-x_{min}$; $H=Q_3-Q_1$; $Q_d=\dfrac{H}{2}$.`,
  langkah: [
    [R`Urutkan: $150,155,158,160,162,165,168,170$.`, R`Kuartil hanya bisa dicari dari data terurut.`],
    [R`$J=170-150=20$.`, R`Data terbesar dikurangi data terkecil.`],
    [R`$Q_2=\dfrac{160+162}{2}=161$.`, R`$n=8$ genap: rata-rata data ke-4 dan ke-5.`],
    [R`Kelompok bawah $150,155,158,160$: $Q_1=\dfrac{155+158}{2}=156{,}5$. Kelompok atas $162,165,168,170$: $Q_3=\dfrac{165+168}{2}=166{,}5$.`, R`$Q_1$ dan $Q_3$ adalah median kelompok bawah dan atas.`],
    [R`$H=166{,}5-156{,}5=10$ dan $Q_d=\dfrac{10}{2}=5$.`, R`Simpangan kuartil adalah setengah jangkauan interkuartil.`]

})}

/* ============ 8. Data Kelompok: Ukuran Pusat ============ */
const KLS = [[41, 50], [51, 60], [61, 70], [71, 80], [81, 90]];
const kgCalc = (f, cls, p, xi) => {
  const n = sum(f), mid = cls.map(c => (c[0] + c[1]) / 2), fx = f.map((x, i) => x * mid[i]), mean = sum(fx) / n;
  let cum = 0, mi = 0; for (let i = 0; i < f.length; i++) { if (cum + f[i] >= n / 2) { mi = i; break; } cum += f[i]; }
  const tb = cls[mi][0] - .5, F = cum, median = tb + ((n / 2 - F) / f[mi]) * p;
  const oi = f.indexOf(Math.max(...f)), d1 = f[oi] - (oi ? f[oi - 1] : 0), dd2 = f[oi] - (oi < f.length - 1 ? f[oi + 1] : 0), tbm = cls[oi][0] - .5, modus = tbm + (d1 + dd2 === 0 ? .5 : d1 / (d1 + dd2)) * p;
  const xs = mid[xi === undefined ? 2 : xi], d = mid.map(m => m - xs), fd = d.map((x, i) => x * f[i]), u = d.map(x => x / p), fu = u.map((x, i) => x * f[i]);
  return { n, mid, fx, mean, mi, tb, F, median, oi, d1, d2: dd2, tbm, modus, xs, d, fd, u, fu, Sfd: sum(fd), Sfu: sum(fu), meanDev: xs + sum(fd) / n, meanKod: xs + p * sum(fu) / n };
};
const kgHist = (f, r, lines) => {
  const mx = Math.max(...f, 1), X = v => 30 + (v - 40.5) / 50 * 440;
  let s = '<svg viewBox="0 0 520 220" class="w-full" style="min-width:440px"><line x1="30" y1="170" x2="470" y2="170" stroke="#334155"/>';
  KLS.forEach((c, i) => { const h = f[i] / mx * 130; s += `<rect x="${X(c[0] - .5)}" y="${170 - h}" width="88" height="${h}" fill="${i === r.mi ? '#fecaca' : '#fef9c3'}" stroke="#1e3a8a"/><text x="${X(c[0] - .5) + 44}" y="${164 - h}" text-anchor="middle" font-size="12">${f[i]}</text><text x="${X(c[0] - .5) + 44}" y="188" text-anchor="middle" font-size="11">${c[0]}–${c[1]}</text>`; });
  if (lines) {
    s += `<line x1="${X(r.mean)}" y1="25" x2="${X(r.mean)}" y2="170" stroke="#dc2626" stroke-width="3"/><text x="${X(r.mean)}" y="18" fill="#dc2626" font-size="11" text-anchor="middle">mean ${d2(r.mean)}</text>`;
    s += `<line x1="${X(r.median)}" y1="35" x2="${X(r.median)}" y2="170" stroke="#1e3a8a" stroke-width="3" stroke-dasharray="5"/><text x="${X(r.median)}" y="212" fill="#1e3a8a" font-size="11" text-anchor="middle">Me ${d2(r.median)}</text>`;
    s += `<line x1="${X(r.modus)}" y1="45" x2="${X(r.modus)}" y2="170" stroke="#a16207" stroke-width="3" stroke-dasharray="2 3"/><text x="${X(r.modus) + 4}" y="40" fill="#a16207" font-size="11">Mo ${d2(r.modus)}</text>`;
  }
  return s + '</svg>';
};
reg('st-kelompok', {

<h3>🎯 Konsep &amp; Definisi</h3>
<p>Untuk data yang banyak, data dikelompokkan ke dalam <b>kelas interval</b> beserta <b>frekuensi</b>-nya. Ukuran pusat dihitung memakai <b>titik tengah kelas</b> ($x_i$), <b>tepi bawah</b> ($Tb$ = batas bawah $-0{,}5$), dan <b>panjang kelas</b> ($p$).</p>

${formula(R`<p><b>Cara 1: Titik tengah</b></p>$$\bar{x}=\frac{\sum f_ix_i}{\sum f_i}$$

${formula(R`<p><b>Median dan Modus</b></p>$$Me=Tb+\left(\frac{\frac{n}{2}-F}{f_{Me}}\right)p\qquad Mo=Tb+\left(\frac{d_1}{d_1+d_2}\right)p$$ $F$ = frekuensi kumulatif <i>sebelum</i> kelas median; $d_1=f_{Mo}-f_{sebelum}$; $d_2=f_{Mo}-f_{sesudah}$. Kelas median: kelas pertama dengan frekuensi kumulatif $\ge\frac{n}{2}$. Kelas modus: frekuensi terbesar.`)}

  init() {

    const draw = () => {

      if (sum(f) === 0) { svg.innerHTML = ''; tb.innerHTML = ''; mm.innerHTML = ''; out.textContent = 'Atur minimal satu frekuensi > 0.'; return; }
      const r = kgCalc(f, KLS, 10, +sx.value), m = sm.value, k = KLS.map((c, i) => c[0] + '–' + c[1]);
      const tot = x => '<b>' + d2(x) + '</b>';
      if (m === 'tt') {
        tb.innerHTML = tbl(k.map((c, i) => [c, f[i], d2(r.mid[i]), d2(r.fx[i])]).concat([['<b>Σ</b>', tot(r.n), '', tot(sum(r.fx))]]), ['Kelas', 'f', 'x', 'f·x']);
        mm.innerHTML = `<p>$\\bar{x}=\\dfrac{\\sum fx}{\\sum f}=\\dfrac{${d2(sum(r.fx))}}{${r.n}}=${d2(r.mean)}$</p>`;

        tb.innerHTML = tbl(k.map((c, i) => [c, f[i], d2(r.mid[i]), d2(r.d[i]), d2(r.fd[i])]).concat([['<b>Σ</b>', tot(r.n), '', '', tot(r.Sfd)]]), ['Kelas', 'f', 'x', 'd = x − xₛ', 'f·d']);
        mm.innerHTML = `<p>$x_s=${d2(r.xs)}$</p><p>$\\bar{x}=x_s+\\dfrac{\\sum fd}{\\sum f}=${d2(r.xs)}+\\dfrac{${d2(r.Sfd)}}{${r.n}}=${d2(r.meanDev)}$</p>`;
      } else {
        tb.innerHTML = tbl(k.map((c, i) => [c, f[i], d2(r.mid[i]), d2(r.u[i]), d2(r.fu[i])]).concat([['<b>Σ</b>', tot(r.n), '', '', tot(r.Sfu)]]), ['Kelas', 'f', 'x', 'u = (x − xₛ)/p', 'f·u']);
        mm.innerHTML = `<p>$x_s=${d2(r.xs)}$, &nbsp; $p=10$</p><p>$\\bar{x}=x_s+p\\left(\\dfrac{\\sum fu}{\\sum f}\\right)=${d2(r.xs)}+10\\left(\\dfrac{${d2(r.Sfu)}}{${r.n}}\\right)=${d2(r.meanKod)}$</p>`;

/* ---- gambar statis untuk contoh soal (histogram & ogive) ---- */
const stHist = (tb0, p, f) => {
  const k = f.length, mx = Math.max(...f), w = 300 / k;
  let s = '<svg viewBox="0 0 370 200" style="width:100%;max-width:400px;display:block;margin:.6rem auto"><line x1="40" y1="160" x2="350" y2="160" stroke="#334155"/><line x1="40" y1="15" x2="40" y2="160" stroke="#334155"/>';
  f.forEach((v, i) => { const x = 45 + i * w, h = v / mx * 125, y = 160 - h; s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fef9c3" stroke="#1e3a8a" stroke-width="1.5"/><text x="${x + w / 2}" y="${y - 4}" text-anchor="middle" font-size="11">${v}</text>`; });
  for (let i = 0; i <= k; i++) s += `<text x="${45 + i * w}" y="176" text-anchor="middle" font-size="9.5">${d2(tb0 + i * p)}</text>`;
  return s + '<text x="195" y="195" font-size="10" text-anchor="middle">nilai</text><text x="44" y="11" font-size="10">frekuensi</text></svg>';
};
const stOgive = (tb0, p, pos, neg) => {
  const k = pos.length, n = pos[k - 1], X = i => 50 + i * 300 / k, Y = c => 165 - c / n * 135;
  let s = '<svg viewBox="0 0 400 215" style="width:100%;max-width:440px;display:block;margin:.6rem auto"><line x1="50" y1="165" x2="360" y2="165" stroke="#334155"/><line x1="50" y1="25" x2="50" y2="165" stroke="#334155"/>';
  for (let i = 0; i <= k; i++) s += `<text x="${X(i)}" y="181" text-anchor="middle" font-size="9.5">${d2(tb0 + i * p)}</text>`;
  const P = [[0, 0]].concat(pos.map((v, i) => [i + 1, v])), N = neg.map((v, i) => [i, v]).concat([[k, 0]]);
  const line = (a, col, dx) => `<polyline points="${a.map(q => X(q[0]) + ',' + Y(q[1])).join(' ')}" fill="none" stroke="${col}" stroke-width="2.5"/>` + a.map(q => `<circle cx="${X(q[0])}" cy="${Y(q[1])}" r="3.5" fill="${col}"/><text x="${X(q[0]) + dx}" y="${Y(q[1]) - 6}" font-size="10" fill="${col}" text-anchor="middle">${q[1]}</text>`).join('');
  return s + line(P, '#dc2626', -9) + line(N, '#1e3a8a', 9) + '<text x="60" y="18" font-size="10" fill="#dc2626">ogive positif</text><text x="150" y="18" font-size="10" fill="#1e3a8a">ogive negatif</text><text x="205" y="208" font-size="10" text-anchor="middle">nilai</text><text x="12" y="95" font-size="10" transform="rotate(-90 12 95)" text-anchor="middle">frekuensi kumulatif</text></svg>';
};

<h2>Data Kelompok: Histogram &amp; Ogive</h2>
<h3>🎯 Konsep &amp; Definisi</h3>
<ul>
<li><b>Histogram</b>: diagram batang <i>berimpit</i> untuk data kelompok. Sumbu mendatar memuat <b>tepi kelas</b>, tinggi batang $=$ frekuensi. Batang tertinggi menunjukkan <b>kelas modus</b>.</li>
<li><b>Frekuensi kumulatif "kurang dari"</b>: banyak data yang nilainya <i>kurang dari tepi atas</i> suatu kelas. <b>Ogive positif</b> adalah grafiknya (garis yang <b>naik</b>), titiknya $(\text{tepi atas},\ fk_{<})$.</li>
<li><b>Frekuensi kumulatif "lebih dari"</b>: banyak data yang nilainya <i>lebih dari tepi bawah</i> suatu kelas. <b>Ogive negatif</b> adalah grafiknya (garis yang <b>turun</b>), titiknya $(\text{tepi bawah},\ fk_{>})$.</li>
<li><b>Perpotongan</b> ogive positif dan ogive negatif berada di ketinggian $\dfrac{n}{2}$, dan absisnya adalah <b>median</b>.</li></ul>
${formula(R`$$fk_{<}(\text{tepi atas kelas ke-}i)=f_1+f_2+\dots+f_i\qquad fk_{>}(\text{tepi bawah kelas ke-}i)=n-(f_1+\dots+f_{i-1})$$ Banyak data pada kelas ke-$i$: $\;f_i=fk_{<}(i)-fk_{<}(i-1)\;=\;fk_{>}(i)-fk_{>}(i+1)$. &nbsp; Median dari ogive: $\;Me=Tb+\left(\dfrac{\frac{n}{2}-F}{f_{Me}}\right)p$.`)}
${tips(R`Ingat: ogive <b>positif</b> $\rightarrow$ <i>kurang dari</i> $\rightarrow$ garis <b>naik</b> (dari $0$ ke $n$). Ogive <b>negatif</b> $\rightarrow$ <i>lebih dari</i> $\rightarrow$ garis <b>turun</b> (dari $n$ ke $0$). Selisih dua ketinggian yang berdekatan pada ogive adalah frekuensi kelas.`)}

  init() {

    };
    const ctx = () => {
      const a0 = A(), p = Pn(), k = f.length, n = sum(f), cls = f.map((_, i) => [a0 + i * p, a0 + i * p + p - 1]), r = kgCalc(f, cls, p, Math.floor(k / 2)), pos = [], neg = []; let c = 0;

    };
    const geo = c => { const x0 = c.tb0 - c.p, x1 = c.tb0 + (c.k + 1) * c.p, mx = Math.max(...c.f, 1); return { X: v => 40 + (v - x0) / (x1 - x0) * 440, Yf: v => 200 - v / mx * 150, Yc: v => 200 - v / c.n * 165, mx }; };
    const frame = () => '<svg viewBox="0 0 520 250" class="w-full" style="min-width:460px"><line x1="40" y1="200" x2="490" y2="200" stroke="#334155"/><line x1="40" y1="25" x2="40" y2="200" stroke="#334155"/>';
    const tick = (g, v) => `<text x="${g.X(v)}" y="217" font-size="10" text-anchor="middle">${d2(v)}</text><line x1="${g.X(v)}" y1="200" x2="${g.X(v)}" y2="204" stroke="#334155"/>`;
    const tepi = (c, g) => Array.from({ length: c.k + 1 }, (_, i) => tick(g, c.tb0 + i * c.p)).join('');
    const bars = (c, g, hl, lite) => c.f.map((v, i) => { const x = g.X(c.tb0 + i * c.p), w = g.X(c.tb0 + (i + 1) * c.p) - x, y = g.Yf(v); return `<rect x="${x}" y="${y}" width="${w}" height="${200 - y}" fill="${hl === i ? '#fecaca' : '#fef9c3'}" fill-opacity="${lite ? .55 : 1}" stroke="#1e3a8a" stroke-width="1.5"/>${lite ? '' : `<text x="${x + w / 2}" y="${y - 5}" font-size="11" text-anchor="middle">${v}</text>`}`; }).join('');
    const vline = (g, v, col, lab, y, dash) => `<line x1="${g.X(v)}" y1="${y}" x2="${g.X(v)}" y2="200" stroke="${col}" stroke-width="3" ${dash ? 'stroke-dasharray="5"' : ''}/><text x="${g.X(v)}" y="${y - 4}" font-size="11" fill="${col}" text-anchor="middle">${lab} ${d2(v)}</text>`;

  () => { const o = kgTab(); return S(`Histogram berikut menyajikan nilai ulangan sekelompok siswa.${histSVG(o.cls, o.f)} Banyak seluruh siswa adalah ...`, o.r.n, [o.r.n + o.p, Math.max(...o.f), o.r.n - 5, o.r.n + 5, o.r.n + 1], R`Banyak seluruh data adalah jumlah semua tinggi batang histogram.`, R`$n=\sum f$`, [R`Tinggi batang (frekuensi): ${o.f.join(', ')}.`, R`$n=${o.f.join('+')}=${o.r.n}$.`], `Seluruhnya ${o.r.n} siswa.`, x => String(x), 2); },
  () => { const o = kgTab(), v = +o.r.modus.toFixed(2); return S(`Histogram berikut menyajikan nilai ulangan sekelompok siswa.${histSVG(o.cls, o.f)} Modus data tersebut adalah ...`, v, [o.r.mean, o.r.median, o.r.tbm, v + 1, v - 1], R`Kelas modus adalah batang tertinggi; gunakan $Mo=Tb+\left(\dfrac{d_1}{d_1+d_2}\right)p$.`, R`$Mo=Tb+\left(\dfrac{d_1}{d_1+d_2}\right)p$`, [R`Batang tertinggi: kelas ${o.cls[o.r.oi][0]}–${o.cls[o.r.oi][1]} ($f=${o.f[o.r.oi]}$), $Tb=${d2(o.r.tbm)}$.`, R`$d_1=${o.r.d1}$, $d_2=${o.r.d2}$, $p=${o.p}$.`, R`$Mo=${d2(o.r.tbm)}+\left(\dfrac{${o.r.d1}}{${o.r.d1}+${o.r.d2}}\right)${o.p}=${d2(v)}$.`], `Modus $\\approx ${d2(v)}$.`, d2, .5); },
  () => { const o = kgTab(), k = ri(1, 4), cp = cumPos(o.cls, o.f), t = o.f[k]; return S(`Ogive positif suatu data memiliki tabel frekuensi kumulatif berikut.${tbl(cp, ['Nilai', 'Frekuensi kumulatif'])} Banyak data pada kelas ${o.cls[k][0]}–${o.cls[k][1]} adalah ...`, t, [cp[k][1], cp[k - 1][1], o.f[k - 1], t + 1, t - 1, t + 2], R`Ogive positif memuat frekuensi kumulatif "kurang dari". Frekuensi kelas $=fk_i-fk_{i-1}$.`, R`$f_i=fk_i-fk_{i-1}$`, [R`Kelas ${o.cls[k][0]}–${o.cls[k][1]} berakhir di tepi atas ${d2(o.cls[k][1] + .5)}, dengan $fk=${cp[k][1]}$.`, R`Kelas sebelumnya berakhir di ${d2(o.cls[k - 1][1] + .5)}, dengan $fk=${cp[k - 1][1]}$.`, R`$f=${cp[k][1]}-${cp[k - 1][1]}=${t}$.`], `Ada ${t} data.`, x => String(x), 1); },
  () => { const o = kgTab(), k = ri(0, 3), cn = cumNeg(o.cls, o.f), t = o.f[k]; return S(`Ogive negatif suatu data memiliki tabel frekuensi kumulatif berikut.${tbl(cn, ['Nilai', 'Frekuensi kumulatif'])} Banyak data pada kelas ${o.cls[k][0]}–${o.cls[k][1]} adalah ...`, t, [cn[k][1], cn[k + 1][1], o.f[k + 1], t + 1, t - 1, t + 2], R`Ogive negatif memuat frekuensi kumulatif "lebih dari". Frekuensi kelas $=fk_i-fk_{i+1}$.`, R`$f_i=fk_i-fk_{i+1}$`, [R`Pada ${cn[k][0]}: $fk=${cn[k][1]}$.`, R`Pada ${cn[k + 1][0]}: $fk=${cn[k + 1][1]}$.`, R`$f=${cn[k][1]}-${cn[k + 1][1]}=${t}$.`], `Ada ${t} data.`, x => String(x), 1); },
  () => { const o = kgTab(), cp = cumPos(o.cls, o.f), v = +o.r.median.toFixed(2); return S(`Ogive positif suatu data memiliki tabel berikut.${tbl(cp, ['Nilai', 'Frekuensi kumulatif'])} Median data tersebut (absis titik potong ogive positif dan negatif) adalah ...`, v, [o.r.tb, o.r.n / 2, o.r.mean, v + 1, v - 1], R`Median berada di ketinggian $\dfrac{n}{2}$ pada ogive: tentukan ruas yang memuat $\dfrac{n}{2}$, lalu interpolasi.`, R`$Me=Tb+\left(\dfrac{\frac{n}{2}-F}{f_{Me}}\right)p$`, [R`$n=${o.r.n}$, $\frac{n}{2}=${d2(o.r.n / 2)}$; kelas median ${o.cls[o.r.mi][0]}–${o.cls[o.r.mi][1]}.`, R`$Tb=${d2(o.r.tb)}$, $F=${o.r.F}$, $f=${o.f[o.r.mi]}$, $p=${o.p}$.`, R`$Me=${d2(o.r.tb)}+\left(\dfrac{${d2(o.r.n / 2)}-${o.r.F}}{${o.f[o.r.mi]}}\right)${o.p}=${d2(v)}$.`], `Median $\\approx ${d2(v)}$.`, d2, .5); }
];
})();
</script>
